# /etc/apache2/sites-available/servidores.conf — Apache detrás de HAProxy
# (el segundo backend es Nginx, en 127.0.0.1:8082)
<VirtualHost 127.0.0.1:8081>
    ServerName donis-asir.ddns.net
    DocumentRoot /var/www/servidor1
    SetEnv SERVIDOR "Apache (puerto 8081)"
</VirtualHost>

# SSI: Apache sustituye <!--#echo var="SERVIDOR" --> en el HTML
<Directory /var/www/servidor1>
    Options +Includes
    AddOutputFilter INCLUDES .html
</Directory>

# Registrar la IP real del cliente (llega en X-Forwarded-For) en vez de 127.0.0.1
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1
