# /etc/haproxy/haproxy.cfg — HAProxy delante de dos Apache en la misma instancia
global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    # Solo TLS 1.2 o superior
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    option forwardfor              # pasa la IP real del cliente en X-Forwarded-For
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Entrada: escucha en 80 y 443 (Apache ya no usa esos puertos)
frontend web
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/donis-asir.ddns.net.pem alpn h2,http/1.1

    # Renovación de Let's Encrypt: el reto HTTP-01 va a Certbot (modo standalone)
    acl reto_acme path_beg /.well-known/acme-challenge/

    # (las reglas http-request se ejecutan antes que use_backend)
    # Todo lo que llegue por HTTP se redirige a HTTPS, salvo el reto de Let's Encrypt
    http-request redirect scheme https code 301 unless { ssl_fc } || reto_acme
    http-request set-header X-Forwarded-Proto https if { ssl_fc }

    use_backend certbot if reto_acme
    acl estadisticas path_beg /estadisticas
    use_backend estadisticas if estadisticas
    default_backend apaches

# Salida: los dos Apache, por turnos
backend apaches
    balance roundrobin
    option httpchk GET /index.html   # si falta la web, devuelve 404 y el servidor sale del reparto
    http-response set-header X-Servidor %s   # nombre del servidor que respondió
    server servidor1 127.0.0.1:8081 check
    server servidor2 127.0.0.1:8082 check

backend certbot
    server certbot 127.0.0.1:8888

# Página de estadísticas: https://donis-asir.ddns.net/estadisticas
backend estadisticas
    stats enable
    stats uri /estadisticas
    stats refresh 5s
    stats auth admin:CAMBIAR_CONTRASENA
    stats admin if TRUE            # permite poner servidores en mantenimiento desde la web
